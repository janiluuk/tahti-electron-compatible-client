<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tahti</title>
    <script>
      (function () {
        try {
          var bag = localStorage.getItem('tahti-web-theme');
          var themeId = null;
          var dark = true;
          if (bag) {
            var parsed = JSON.parse(bag);
            var state = parsed && parsed.state ? parsed.state : parsed;
            if (state) {
              if (typeof state.themeId === 'string') themeId = state.themeId;
              if (typeof state.dark === 'boolean') dark = state.dark;
            }
          }
          if (!themeId) themeId = localStorage.getItem('tahti-nuclear-theme-id');
          var darkRaw = localStorage.getItem('tahti-nuclear-dark');
          if (darkRaw != null) dark = darkRaw === '1';
          if (themeId)
            document.documentElement.setAttribute('data-theme-id', themeId);
          if (dark) document.documentElement.setAttribute('data-theme', 'dark');
          else document.documentElement.removeAttribute('data-theme');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
