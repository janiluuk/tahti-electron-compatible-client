# Nuclear × Tahti web (beta) — static SPA + public API proxy
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API → public Tahti API (cookies work; CORS not needed for same origin)
    location /tahti-api/ {
        proxy_pass https://api.tahti.live/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host api.tahti.live;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    # Optional: also expose /api for absolute paths some clients use
    location /api/ {
        proxy_pass https://api.tahti.live/api/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host api.tahti.live;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
